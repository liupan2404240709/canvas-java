server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: canvas-server
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 64MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  version: 0.0.1
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173
  # JWT 配置。secret 必须 >= 32 字节（HS256 的最低密钥长度），
  # 长度不够 Jwts.hmacShaKeyFor 会在启动时直接抛 WeakKeyException，属于"早点炸比线上炸好"。
  jwt:
    secret: canvas-dev-secret-key-please-change-in-production-2026
    issuer: canvas-server
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  # 登录失败保护：同一账号连续失败 5 次锁 15 分钟，两个值都可以按需调整。
  login-protection:
    max-attempts: 5
    lock-duration: 15m

logging:
  level:
    com.infinitecanvas.canvas: info
