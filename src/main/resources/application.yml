server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: canvas-server
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 容器层上限，比业务上限（app.storage.max-video-size = 100MB）宽松一点：
      # 容器只管"总共多大"，不认识 MIME；让请求先落到 Controller，
      # 由应用层给出"视频超过 100MB"这种能看懂的提示，而不是一个框架异常。
      max-file-size: 128MB
      max-request-size: 160MB

mybatis-plus:
  # XML 位置。MyBatis-Plus 的默认值就是 classpath*:/mapper/**/*.xml，
  # 显式写出来的好处是：以后有人把 XML 挪到别处，不用去翻文档猜默认值。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  version: 0.0.1
  cors:
    # 3000 是前端 vite 的端口（package.json 里 dev 脚本），
    # 5173 是 vite 默认端口，4173 是 vite preview。阶段 9 接前端时不用再改配置。
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:4173
  # JWT 配置。secret 必须 >= 32 字节（HS256 的最低密钥长度），
  # 长度不够 Jwts.hmacShaKeyFor 会在启动时直接抛 WeakKeyException，属于"早点炸比线上炸好"。
  jwt:
    secret: canvas-dev-secret-key-please-change-in-production-2026
    issuer: canvas-server
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  # 登录失败保护：同一账号连续失败 5 次锁 15 分钟，两个值都可以按需调整。
  login-protection:
    max-attempts: 5
    lock-duration: 15m
  # 文件存储。root 是相对启动目录的路径，跟项目放在一起方便学习时直接去翻文件。
  storage:
    root: ./data/uploads
    # 不含 context-path：servlet 里是 /media/**，浏览器访问 /api/media/**
    public-prefix: /media
    max-image-size: 20MB
    max-video-size: 100MB
    max-audio-size: 20MB
  # 提示词库同步。扫描间隔和"每个源刷多勤"是两件事：
  # scan-cron 决定多久扫一次，refresh_interval_minutes 决定扫到之后刷不刷。
  prompt:
    scan-cron: "0 */5 * * * *"
    connect-timeout: 5s
    read-timeout: 20s
    max-response-size: 8MB
    tag-cache-ttl: 5m
    tag-facet-limit: 100
    schedule-batch: 20
    # 安全开关：允许请求内网/回环地址。本地开发要 true（e2e 用本机的样例 JSON 做同步），
    # 一旦这个服务对外暴露就必须改成 false，否则等于给别人开了一个内网探测接口
    allow-private-host: true

logging:
  level:
    com.infinitecanvas.canvas: info
